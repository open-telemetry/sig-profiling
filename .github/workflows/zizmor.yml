name: Zizmor

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '10 18 * * 4' # weekly at 18:10 UTC on Thursday
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    permissions:
      contents: read # for actions/checkout
      security-events: write # for zizmor to upload SARIF results
    uses: open-telemetry/shared-workflows/.github/workflows/zizmor.yml@9ba7b96740beb68158e4f1cdfd10a3b794364711 # v0.8.0
